---
- hosts: all
  connection: local
  vars_prompt:
    - name: ansible_become_password
      prompt: "Enter the sudo password for target hosts"
      private: true
      confirm: false  
  pre_tasks:
    - name: Validate if OSX
      fail:
        msg: "Detected an incompatible OS"
      when: ansible_facts.os_family != 'Darwin'        
  roles:
    - shell
    - basic-tools
    - devenv
